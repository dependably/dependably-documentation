stages:
  - check
  - publish

# OCI pull-through mirror for CI container images — the runners cannot reach
# Docker Hub's CDN, so every image resolves through the mirror (same convention
# as dependably-community's pipeline).
variables:
  DEP_IMAGE_REGISTRY: "dependably.northwardlabs.ca"

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

spell:
  stage: check
  # Debian, not Alpine + pip: the runners resolve the Debian mirrors but not
  # pypi.org, and the instance's PyPI proxy requires credentials this project
  # does not hold. Debian packages codespell, so apt is the reachable route.
  image: ${DEP_IMAGE_REGISTRY}/library/debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends codespell
    - codespell docs/ README.md

markdownlint:
  stage: check
  image: ${DEP_IMAGE_REGISTRY}/library/node:20-alpine
  script:
    - npx -y markdownlint-cli2 "docs/**/*.md" "README.md"

links:
  stage: check
  image:
    name: ${DEP_IMAGE_REGISTRY}/lycheeverse/lychee:latest
    entrypoint: [""]
  script:
    # Internal-only — external HTTP(S) checks are flaky in CI.
    - lychee --no-progress --exclude '^https?://' docs/ README.md

secrets:
  stage: check
  image:
    name: ${DEP_IMAGE_REGISTRY}/zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact -v

publish:github:
  stage: publish
  image:
    name: ${DEP_IMAGE_REGISTRY}/alpine/git:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - '[ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN not set in CI/CD variables"; exit 1; }'
    - echo "Mirroring $CI_COMMIT_SHA to github.com/dependably/dependably-documentation"
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/dependably/dependably-documentation.git"
    - git push github HEAD:refs/heads/main
